name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Show toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Build release with warnings as errors
        run: swift build -c release -Xswiftc -warnings-as-errors
